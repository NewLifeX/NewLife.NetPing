name: publish-beta

on:
  push:
    branches: [ master ]
    paths:
        - 'NewLife.NetPing/**'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d-beta%H%M')" >> "$GITHUB_ENV"
    - name: Build
      run: dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.NetPing/NewLife.NetPing.csproj
    - name: Publish to GitHub Packages
      id: ghpackages
      continue-on-error: true
      run: dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet.org
      id: nuget
      run: dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
    - name: Publish Summary
      if: always()
      shell: pwsh
      run: |
        $rows = [ordered]@{
          'GitHub Packages' = '${{ steps.ghpackages.outcome }}'
          'NuGet.org'       = '${{ steps.nuget.outcome }}'
        }
        $marks = @{ success = '✅'; failure = '⚠️'; skipped = '⏭'; cancelled = '⛔' }
        $lines = @('### 测试版发布结果', '', '| 渠道 | 结果 |', '| --- | --- |')
        foreach ($k in $rows.Keys) {
          $o = $rows[$k]
          $lines += "| $k | $($marks[$o]) $o |"
        }
        $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
